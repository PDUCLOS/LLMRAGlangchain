# ===========================================================================
# erp-ai-copilot — infrastructure locale
#
#   docker compose up -d                      -> Azurite + Qdrant (ARM64 et x86)
#   docker compose --profile sqlserver up -d  -> + SQL Server (x86 requis)
#
# SQL Server ne publie AUCUNE image ARM64 : sur Mac Apple Silicon le
# conteneur segfault sous émulation QEMU (constaté sur macOS 27 / Docker 29).
# Sur le LG Gram (x86-64) le conteneur tourne nativement.
# ===========================================================================

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: erp-azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/devstoreaccount1?comp=list"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qcr.qdrant.io/qdrant/qdrant:latest
    container_name: erp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'healthz check passed'"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-sqlserver
    platform: linux/amd64
    profiles: ["sqlserver"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Dev_Only_2026!}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  azurite-data:
  qdrant-data:
  sqlserver-data:
