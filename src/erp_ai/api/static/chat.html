<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copilote ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Interface de démonstration : une colonne de conversation, un panneau de sources à droite. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --ink: #17202e; --muted: #5b6577; --line: #dde1e8;
  --accent: #2f55c9; --accent-soft: #e5ebfb; --good: #1f7a4d; --good-soft: #e1f2e8;
  --warn: #9a6200; --warn-soft: #fbefd9;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #10141b; --surface: #171c25; --ink: #e6e9ef; --muted: #98a1b3; --line: #2a3140;
  --accent: #7e9cf2; --accent-soft: #1e2a4a; --good: #5cc78f; --good-soft: #15301f;
  --warn: #e3a948; --warn-soft: #33270f; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px max(16px, 3vw); border-bottom: 1px solid var(--line); background: var(--surface); }
header h1 { font: 600 1.3rem var(--f-display); margin: 0; }
.status { font: 0.78rem var(--f-mono); color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--good); }
header .spacer { flex: 1; }
header label { font-size: 0.85rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
select, textarea, button { font: inherit; color: var(--ink); }
select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; } aside { display: none; } }
.chat { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
.log { overflow-y: auto; padding: 24px max(16px, 3vw); display: flex; flex-direction: column; gap: 18px; }
.empty { max-width: 640px; display: grid; gap: 12px; }
.empty p { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.88rem; text-align: left; }
.chips button:hover { border-color: var(--accent); color: var(--accent); }
.msg { max-width: 760px; display: grid; gap: 8px; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; padding: 10px 14px; border-radius: 10px 10px 2px 10px; }
.msg.bot .bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 10px 10px 10px 2px; padding: 12px 16px; }
.bubble ul { margin: 6px 0; padding-left: 20px; }
.bubble p { margin: 6px 0; }
.cite { font: 500 0.72rem var(--f-mono); background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 1px 5px; cursor: pointer; border: 0; vertical-align: 1px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 0.75rem var(--f-mono); color: var(--muted); }
.pill { padding: 1px 8px; border-radius: 999px; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.refus { background: var(--warn-soft); color: var(--warn); }
details.sql { font-size: 0.82rem; color: var(--muted); }
details.sql code { display: block; white-space: pre-wrap; font: 0.78rem var(--f-mono); background: var(--bg); padding: 8px; border-radius: 4px; margin-top: 4px; }
form { display: flex; gap: 10px; padding: 14px max(16px, 3vw); border-top: 1px solid var(--line); background: var(--surface); }
textarea { flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); min-height: 46px; }
textarea:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
form button { border: 0; background: var(--accent); color: #fff; padding: 0 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
form button:disabled { opacity: 0.5; cursor: wait; }
aside { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; padding: 20px; display: grid; gap: 12px; align-content: start; }
aside h2 { font: 600 1rem var(--f-display); margin: 0; }
.src { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 2px; font-size: 0.85rem; }
.src b { font-family: var(--f-mono); font-size: 0.75rem; color: var(--accent); }
.src.hl { border-color: var(--accent); background: var(--accent-soft); }
.src .t { color: var(--muted); font-size: 0.8rem; }
.typing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Copilote ERP</h1>
  <span class="status"><span class="dot" id="dot"></span><span id="status">connexion…</span></span>
  <span class="spacer"></span>
  <label for="role">Profil
    <select id="role">
      <option value="daf">DAF</option>
      <option value="controleur">Contrôleur de gestion</option>
      <option value="admin">Administratif</option>
    </select>
  </label>
</header>
<main>
  <section class="chat">
    <div class="log" id="log">
      <div class="empty" id="empty">
        <p>Posez une question sur les procédures, les contrats ou les impayés. Chaque réponse cite ses sources ; sans source, le copilote refuse plutôt que d'inventer.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
    <form id="form">
      <textarea id="q" rows="1" placeholder="Ex. : quelles factures sont en retard de plus de 60 jours ?" aria-label="Question"></textarea>
      <button type="submit" id="send">Envoyer</button>
    </form>
  </section>
  <aside>
    <h2>Sources de la dernière réponse</h2>
    <div id="sources"><p class="t">Les documents et lignes ERP utilisés apparaîtront ici.</p></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EXEMPLES = [
  "Quelles factures sont en retard de paiement au-delà de 60 jours ?",
  "Quel est le barème des remises selon le chiffre d'affaires ?",
  "Un client a 70 jours de retard : garde-t-il sa remise ?",
  "Quelles sont les étapes de la clôture mensuelle ?",
  "Quelle est la capitale de l'Australie ?",
];
$("chips").innerHTML = EXEMPLES.map(q => `<button type="button">${esc(q)}</button>`).join("");
$("chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });

fetch("/health").then(r => r.json()).then(h => {
  if (h.status === "ok") $("dot").classList.add("ok");
  $("status").textContent = `${h.providers.llm} · ${h.providers.model} · embeddings ${h.providers.embeddings} · ${h.database.dialect} · ${h.index.fragments} fragments indexés`;
}).catch(() => { $("status").textContent = "API injoignable"; });

// Mise en forme minimale : puces, gras, citations [Sx] cliquables.
function render(text) {
  const lines = esc(text).split("\n");
  let html = "", inList = false;
  for (const raw of lines) {
    const line = raw.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[S(\d+)\]/g, '<button type="button" class="cite" data-ref="S$1">S$1</button>');
    const m = line.match(/^\s*[\*\-]\s+(.*)/);
    if (m) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${m[1]}</li>`; }
    else { if (inList) { html += "</ul>"; inList = false; } if (line.trim()) html += `<p>${line}</p>`; }
  }
  return html + (inList ? "</ul>" : "");
}

function showSources(sources) {
  $("sources").innerHTML = sources.length ? sources.map(s =>
    `<div class="src" id="src-${esc(s.ref)}"><b>${esc(s.ref)}</b><span>${esc(s.document)}</span>${s.section ? `<span class="t">§ ${esc(s.section)}</span>` : ""}</div>`).join("")
    : '<p class="t">Aucune source.</p>';
}

$("log").addEventListener("click", e => {
  const ref = e.target.dataset?.ref; if (!ref) return;
  document.querySelectorAll(".src.hl").forEach(n => n.classList.remove("hl"));
  const el = document.getElementById("src-" + ref);
  if (el) { el.classList.add("hl"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
});

async function ask(question) {
  question = question.trim(); if (!question) return;
  $("empty")?.remove();
  $("q").value = ""; $("send").disabled = true;
  $("log").insertAdjacentHTML("beforeend", `<div class="msg user">${esc(question)}</div><div class="msg bot" id="pending"><div class="bubble typing">Recherche dans les documents et l'ERP…</div></div>`);
  $("log").scrollTop = $("log").scrollHeight;
  try {
    const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, role: $("role").value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    const u = d.usage;
    const refus = d.statut !== "OK" || /pas de source suffisante/i.test(d.answer);
    $("pending").outerHTML = `<div class="msg bot"><div class="bubble">${render(d.answer)}</div>
      ${d.sql ? `<details class="sql"><summary>SQL exécuté en lecture seule (${d.sql.rowcount} ligne(s))</summary><code>${esc(d.sql.sql)}</code></details>` : ""}
      <div class="meta"><span class="pill ${refus ? "refus" : "ok"}">${refus ? "refus : hors corpus" : d.sources.length + " sources"}</span>
      <span>${esc(u.model)} · chaîne ${esc(u.chain)}</span><span>${u.tokens_in} → ${u.tokens_out} tokens</span>
      <span>${(u.latence_ms / 1000).toFixed(1)} s</span><span>${u.cout_eur.toFixed(5)} € éq. Azure</span></div></div>`;
    showSources(d.sources);
  } catch (err) {
    $("pending").outerHTML = `<div class="msg bot"><div class="bubble">Erreur : ${esc(err.message)}</div></div>`;
  } finally {
    $("send").disabled = false; $("q").focus(); $("log").scrollTop = $("log").scrollHeight;
  }
}
$("form").addEventListener("submit", e => { e.preventDefault(); ask($("q").value); });
// Lien de démo : /?q=question&role=controleur pose la question au chargement.
const params = new URLSearchParams(location.search);
if (params.get("role")) $("role").value = params.get("role");
if (params.get("q")) ask(params.get("q"));
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask($("q").value); } });
</script>
</body>
</html>
