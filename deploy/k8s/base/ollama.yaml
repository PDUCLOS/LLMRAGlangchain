# Ollama sur un nœud GPU. Une réplique par GPU : le modèle occupe la VRAM.
# Pré-requis cluster : NVIDIA device plugin (expose la ressource nvidia.com/gpu).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate          # l'ancien et le nouveau pod ne peuvent pas partager le GPU
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ollama
          image: ollama/ollama:0.40.3
          ports:
            - containerPort: 11434
          env:
            - { name: OLLAMA_KEEP_ALIVE, value: "24h" }    # modèle gardé chaud en VRAM
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "2" }  # LLM + embeddings
          resources:
            requests: { cpu: "2", memory: 8Gi }
            limits:
              memory: 16Gi
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet: { path: /api/tags, port: 11434 }
            periodSeconds: 10
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
