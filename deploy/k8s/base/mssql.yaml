# SQL Server en StatefulSet : identité et volume stables pour une base.
# En cloud, préférer un service managé (Azure SQL) : l'overlay `cloud` retire
# ce fichier et pointe DATABASE_URL dessus.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mssql
spec:
  serviceName: mssql
  replicas: 1
  selector:
    matchLabels: { app: mssql }
  template:
    metadata:
      labels: { app: mssql }
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - { name: ACCEPT_EULA, value: "Y" }
            - { name: MSSQL_PID, value: "Developer" }
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: { name: erp-ai-secrets, key: MSSQL_SA_PASSWORD }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { memory: 4Gi }
          readinessProbe:
            tcpSocket: { port: 1433 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: mssql-data, mountPath: /var/opt/mssql }
  volumeClaimTemplates:
    - metadata:
        name: mssql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mssql
spec:
  selector: { app: mssql }
  ports:
    - port: 1433
      targetPort: 1433
