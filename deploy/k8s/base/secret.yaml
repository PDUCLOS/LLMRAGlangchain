# Secrets : NE PAS committer de vraies valeurs. Les valeurs ci-dessous sont des
# exemples à remplacer. En production : Azure Key Vault (CSI driver) ou
# External Secrets, ou création hors dépôt :
#   kubectl -n erp-ai create secret generic erp-ai-secrets --from-env-file=secrets.env
#
# Moindre privilège :
#   - DATABASE_URL        -> compte erp_app (lecture/écriture applicative, pas de DDL) : utilisé par l'API
#   - DATABASE_URL_ADMIN  -> compte sa : utilisé UNIQUEMENT par le Job d'initialisation
#   - erp_readonly (SELECT seul) est créé par sql/01_roles.sql pour le Text-to-SQL
apiVersion: v1
kind: Secret
metadata:
  name: erp-ai-secrets
type: Opaque
stringData:
  MSSQL_SA_PASSWORD: "CHANGE_ME_Sa_2026!"
  ERP_APP_PASSWORD: "CHANGE_ME_App_2026!"
  ERP_READONLY_PASSWORD: "CHANGE_ME_Ro_2026!"
  ERP_INGEST_PASSWORD: "CHANGE_ME_Ingest_2026!"
  DATABASE_URL: "mssql+pyodbc://erp_app:CHANGE_ME_App_2026!@mssql:1433/erp_ai?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
  DATABASE_URL_ADMIN: "mssql+pyodbc://sa:CHANGE_ME_Sa_2026!@mssql:1433/erp_ai?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
