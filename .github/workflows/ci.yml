name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Runner x86-64 : SQL Server y est natif (indisponible sur ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Only_2026!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Only_2026!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sqlserver,langchain]"

      - name: Installer le pilote ODBC Microsoft (msodbcsql18)
        run: |
          set -euo pipefail
          # `pyodbc` est un binding : sans le pilote Microsoft, la connexion
          # échoue avec « Can't open lib 'ODBC Driver 18 for SQL Server' ».
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          . /etc/os-release
          INSTALLED=0
          for VER in "${VERSION_ID:-24.04}" 24.04 22.04; do
            if curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VER}/prod.list" \
                 | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null; then
              echo "dépôt Microsoft : ubuntu/${VER}"
              INSTALLED=1
              break
            fi
          done
          [ "$INSTALLED" = "1" ] || { echo "Aucun dépôt Microsoft trouvé"; exit 1; }
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          echo "--- pilotes ODBC installés ---"
          odbcinst -q -d

      - name: Lint
        run: ruff check src tests scripts

      - name: Contrôle de types
        run: mypy src || true

      - name: Tests (hors SQL Server)
        run: pytest -q -m "not sqlserver and not azure" --cov=src/erp_ai --cov-report=term-missing

      - name: Créer la base de test et appliquer le schéma T-SQL
        env:
          SQLSERVER_URL: "mssql+pyodbc://sa:Ci_Only_2026!@localhost:1433/erp_ai_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
        run: |
          # Confronte le T-SQL de production au moteur cible : c'est ce
          # fichier qui doit tenir debout, pas seulement le schéma Python.
          python scripts/apply_sqlserver_schema.py \
            --url "$SQLSERVER_URL" \
            --database erp_ai_test \
            --schema-file sql/00_schema.sql

      - name: Tests sur SQL Server réel
        env:
          ERP_AI_TEST_DATABASE_URL: "mssql+pyodbc://sa:Ci_Only_2026!@localhost:1433/erp_ai_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
        run: pytest -q -m "sqlserver"

      - name: Évaluation RAG (gold set, mode offline déterministe)
        run: python -m erp_ai.cli eval
