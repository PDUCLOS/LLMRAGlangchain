[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erp-ai-copilot"
version = "0.1.0"
description = "Assistant IA & automatisation ERP (Sage / EBP) sur Azure : RAG documentaire, Text-to-SQL en lecture seule, agents d'automatisation et restitution Power BI / Teams."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Patrice Duclos" }]
keywords = ["azure", "rag", "erp", "sage", "ebp", "copilot", "text-to-sql"]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
# SQL Server (Windows / Linux x86-64). Nécessite msodbcsql18.
sqlserver = ["pyodbc>=5.1"]
# Variante LangChain de la chaîne RAG (LCEL) — cœur LangChain, léger
langchain = [
  "langchain-core>=0.3",
]
# Azure : OpenAI, AI Search, identité managée, modèle LangChain Azure
azure = [
  "openai>=1.40",
  "azure-search-documents>=11.5.0",
  "azure-identity>=1.17",
  "langchain-openai>=0.2",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
erp-ai = "erp_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "sqlserver: tests nécessitant une instance SQL Server réelle",
  "azure: tests nécessitant un compte Azure",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
